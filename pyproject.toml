[project]
name = "reelkit"
version = "0.1.0"
description = "Local pipeline for faceless animated reels: idea -> script -> voice -> sound -> video"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.scripts]
reel = "reelkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reelkit"]
